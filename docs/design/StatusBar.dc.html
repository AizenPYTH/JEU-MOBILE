<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:54px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:8px 26px 0 30px;flex:none;box-sizing:border-box;width:100%;font-family:'Geist',sans-serif">
  <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000"></div>
  <sc-if value="{{ isClock }}" hint-placeholder-val="{{ false }}">
    <span style="font-size:16px;font-weight:600;color:#ECEAE6;letter-spacing:-0.01em;width:72px;text-align:center">{{ time }}</span>
  </sc-if>
  <sc-if value="{{ isNormal }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 9px;border-radius:13px;background:rgba(236,234,230,0.08);box-shadow:inset 0 0 0 1px rgba(236,234,230,0.08)">
      <span style="width:6px;height:6px;border-radius:3px;background:#E3B158"></span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:#ECEAE6;font-variant-numeric:tabular-nums;letter-spacing:-0.02em">{{ time }}</span>
    </div>
  </sc-if>
  <sc-if value="{{ isLow }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 9px;border-radius:13px;background:rgba(227,177,88,0.14);box-shadow:inset 0 0 0 1px rgba(227,177,88,0.35)">
      <span style="width:6px;height:6px;border-radius:3px;background:#E3B158;box-shadow:0 0 0 3px rgba(227,177,88,0.25)"></span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:#E3B158;font-variant-numeric:tabular-nums;letter-spacing:-0.02em">{{ time }}</span>
    </div>
  </sc-if>
  <sc-if value="{{ isCritical }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 9px;border-radius:13px;background:rgba(229,83,75,0.16);box-shadow:inset 0 0 0 1px rgba(229,83,75,0.5)">
      <span style="width:6px;height:6px;border-radius:3px;background:#E5534B;box-shadow:0 0 0 3px rgba(229,83,75,0.3)"></span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#FF6B61;font-variant-numeric:tabular-nums;letter-spacing:-0.02em">{{ time }}</span>
    </div>
  </sc-if>
  <div style="display:flex;align-items:center;gap:7px">
    <div style="display:flex;align-items:flex-end;gap:2px;height:11px">
      <span style="width:3px;height:4px;border-radius:1px;background:#ECEAE6"></span>
      <span style="width:3px;height:6px;border-radius:1px;background:#ECEAE6"></span>
      <span style="width:3px;height:8px;border-radius:1px;background:#ECEAE6"></span>
      <span style="width:3px;height:11px;border-radius:1px;background:rgba(236,234,230,0.35)"></span>
    </div>
    <div style="width:24px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(236,234,230,0.45);padding:2px;box-sizing:border-box;display:flex">
      <span style="width:{{ battery }};height:100%;border-radius:2px;background:#ECEAE6"></span>
    </div>
  </div>
  <sc-if value="{{ showTrack }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:30px;right:30px;bottom:-4px;height:2px;border-radius:1px;background:rgba(236,234,230,0.06)">
      <div style="height:100%;border-radius:1px;width:{{ progress }};background:{{ trackColor }}"></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:60},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;timer&quot;,&quot;clock&quot;],&quot;default&quot;:&quot;timer&quot;,&quot;tsType&quot;:&quot;'timer'|'clock'&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;low&quot;,&quot;critical&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;'normal'|'low'|'critical'&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;06:42&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;battery&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;62%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'timer';
    const level = this.props.level ?? 'normal';
    const t = mode === 'timer';
    return {
      time: this.props.time ?? '06:42',
      isClock: !t,
      isNormal: t && level === 'normal',
      isLow: t && level === 'low',
      isCritical: t && level === 'critical',
      battery: this.props.battery ?? '62%',
      showTrack: t && !!this.props.progress,
      progress: this.props.progress,
      trackColor: level === 'critical' ? '#E5534B' : level === 'low' ? '#E3B158' : 'rgba(236,234,230,0.5)'
    };
  }
}
</script>
</body>
</html>
